name: "2TB Total Bases Model CI"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/build_tb_features.py
      - run: python scripts/train_tb_models.py
      - run: python scripts/backtest_tb.py
